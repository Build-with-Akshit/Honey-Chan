<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d98236" />
      <stop offset="100%" stop-color="#a6541f" />
    </linearGradient>
    <linearGradient id="honeyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffde43" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84431e" />
      <stop offset="100%" stop-color="#693315" />
    </linearGradient>
  </defs>

  <!-- Honey Dipper Stick -->
  <g transform="rotate(22 55 25)">
    <rect x="52" y="5" width="6" height="30" rx="3" fill="#8d5b34" />
    <!-- Dipper head grooves -->
    <ellipse cx="55" cy="12" rx="7" ry="4" fill="#6d3e1d" />
    <ellipse cx="55" cy="17" rx="8" ry="4.5" fill="#6d3e1d" />
    <ellipse cx="55" cy="22" rx="7" ry="4" fill="#6d3e1d" />
    <ellipse cx="55" cy="14" rx="6" ry="2" fill="#d97706" />
  </g>

  <!-- Pot Back Rim -->
  <ellipse cx="50" cy="36" rx="26" ry="7" fill="#8d4418" />

  <!-- Pot Body -->
  <path d="M 24 38 
           C 16 46, 16 58, 22 72 
           C 27 82, 33 86, 50 86 
           C 67 86, 73 82, 78 72 
           C 84 58, 84 46, 76 38 
           Z" 
        fill="url(#potGrad)" />

  <!-- Pot Mid Stripe / Band -->
  <path d="M 18.5 56 
           C 18 63, 21 72, 26 77 
           C 33 82, 42 83, 50 83 
           C 58 83, 67 82, 74 77 
           C 79 72, 82 63, 81.5 56 
           Z" 
        fill="url(#bandGrad)" />

  <!-- Honey Dripping Rim / Top -->
  <path d="M 23 35 
           C 23 31, 77 31, 77 35 
           C 78 43, 73 47, 68 46 
           C 64 45, 62 52, 57 52 
           C 53 52, 51 45, 47 45 
           C 43 45, 40 55, 33 54 
           C 27 53, 25 43, 23 35 
           Z" 
        fill="url(#honeyGrad)" />

  <!-- Honey Highlights & Drop -->
  <ellipse cx="48" cy="34" rx="22" ry="4" fill="#fff" opacity="0.35" />
  
  <!-- Droplet on jar -->
  <circle cx="56" cy="46" r="3.5" fill="#fbbf24" />
  <circle cx="55" cy="45" r="1.2" fill="#fff" opacity="0.7" />

</svg>
